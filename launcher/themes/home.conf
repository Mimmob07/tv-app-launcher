# Hyrule Home: the settings to start from. install.sh pushes this once; after that the TV keeps
# its own copy and Options edits it. Push it again to /sdcard/Android/media/tv.dumbtv.home/home.conf
# to apply a change from here.
theme=hyrule
background=theme
rotate=hourly
dim=20
widgets=time:5x4,weather:7x4,forecast:12x2
weather.place=Ann Arbor
weather.lat=42.2808
weather.lon=-83.7430
weather.units=f
apps.show=com.amazon.venezia
